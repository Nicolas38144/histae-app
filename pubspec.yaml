name: histae_app
description: "Histae mobile app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  http_parser: ^4.1.2
  path_provider: ^2.1.6
  geolocator: ^14.1.1

  cupertino_icons: ^2.0.0
  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - .env
    - assets/fonts/dm_serif_display/OFL.txt
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/dm_serif_display/DMSerifDisplay-Regular.ttf
