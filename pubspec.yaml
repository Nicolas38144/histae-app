name: histae_app
description: "Histae mobile app"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.2
  in_app_purchase: 3.3.1
  in_app_purchase_android: 0.5.5
  in_app_purchase_storekit: 0.4.15
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  http_parser: ^4.1.2
  path_provider: ^2.1.6
  geolocator: ^14.1.1

  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  analyzer: ^10.1.0
  flutter_lints: ^6.0.0

flutter:

  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/branding/histae-signature-dark.png
    - assets/branding/histae-signature-light.png
    - assets/fonts/inter/OFL.txt
    - assets/fonts/source_serif_4/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Variable.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/source_serif_4/SourceSerif4-Variable.ttf
          weight: 400
        - asset: assets/fonts/source_serif_4/SourceSerif4-Variable.ttf
          weight: 500
        - asset: assets/fonts/source_serif_4/SourceSerif4-Variable.ttf
          weight: 600
        - asset: assets/fonts/source_serif_4/SourceSerif4-Variable.ttf
          weight: 700
